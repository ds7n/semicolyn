# Semicolyn is GPL-3.0-only. Every dependency must resolve to a GPL-3-compatible
# license. aws-lc-rs is GPL-3-compatible since AWS-LC relicensed its
# OpenSSL-derived sources to Apache-2.0 (PR #3091). This gate fails if an
# OpenSSL-licensed crate (e.g. an old aws-lc-sys) sneaks back in.
[licenses]
allow = [
    "GPL-3.0",   # cargo-deny takes the bare GNU id; it covers -only
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

# Check only the platforms we build: the iOS app slices (scripts/build-xcframework.sh)
# and Linux, where CI runs the tests. Crates a dependency pulls in only for other
# platforms (e.g. russh-util's wasm-only chrono) are never compiled, so they are not
# checked.
[graph]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "x86_64-unknown-linux-gnu",
]

# Fail if the GPL-incompatible `ring` backend is pulled in alongside aws-lc-rs.
[bans]
deny = [{ name = "ring" }]

# Security advisories (RustSec), checked in CI by `cargo deny check advisories`.
[advisories]
yanked = "deny"
ignore = [
    # rsa Marvin timing side channel: no fixed release exists. The client only signs
    # with an imported RSA key (once per connection, never decrypts); semicolyn
    # generates Ed25519 keys only. Revisit when rsa ships a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "no fix upstream; sign-only use, Ed25519 is the default" },
]
