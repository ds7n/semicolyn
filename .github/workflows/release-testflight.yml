# Build, sign, and upload Semicolyn to TestFlight entirely on the GitHub macOS runner,
# NO personal Mac required. Dormant until you opt in: the job only runs when the repo
# variable TESTFLIGHT_ENABLED == 'true' AND it is triggered manually. Setup (paid Apple
# Developer Program + App Store Connect API key + the four secrets + the variable) is in
# docs/testflight-setup.md.
#
# Signing uses an App Store Connect API key (.p8) with -allowProvisioningUpdates, so Xcode
# manages the certificate + provisioning profile in the cloud, nothing to generate locally.
name: Release to TestFlight

on:
  workflow_dispatch:   # manual only, never runs on push / PR
    inputs:
      supporter_preview:
        # Compiles in SUPPORTER_PREVIEW (BuildChannelDetector → .testFlight): the
        # Supporter preview toggle and all Supporter themes/icons show. NEVER submit a
        # build made with this on for App Review; the log prints SUPPORTER_PREVIEW=on|off.
        description: "TestFlight-only Supporter preview toggle (never for App Store submissions)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  testflight:
    # Stays inert until you set the repo variable TESTFLIGHT_ENABLED=true (Settings →
    # Secrets and variables → Actions → Variables). Until then this job is skipped.
    if: vars.TESTFLIGHT_ENABLED == 'true'
    # xcode-27 (preview image, macOS 26 + Xcode 27): App Store uploads need the iOS 27 SDK
    # from April 2027 (ITMS-90725). Switch to macos-26/macos-latest once Xcode 27 is there.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Only the submodules the build compiles; a recursive checkout pulls ET's unused
      # sentry-native/crashpad tree from chromium.googlesource.com, which flakes with 503s.
      - name: Check out build submodules
        run: bash scripts/ci-submodules.sh

      - name: Select latest-stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Build Mosh.xcframework (cross-compile vendored blinksh/mosh, M1)
        # The macOS package manifest references Mosh.xcframework as a binaryTarget,
        # so `xcodebuild archive` fails package resolution until it exists. Mirrors
        # the ci.yml macos job (which is why plain CI is green but this lane was not).
        run: bash scripts/build-mosh-xcframework.sh

      - name: Install CMake + Ninja (eternaltermlib cross-build)
        # ET drives cmake directly via the leetal/ios-cmake toolchain. macos ships
        # cmake, but pin it defensively. Mirrors the ci.yml macos job.
        run: brew list cmake >/dev/null 2>&1 || brew install cmake ninja

      - name: Build ETerminal.xcframework (cross-compile vendored eternaltermlib, ET)
        # Package.swift references ETerminal.xcframework as a macOS-only binaryTarget,
        # so `xcodebuild archive` fails package resolution until it exists. This lane
        # was missing this step (added to ci.yml with PR #115 but not here), which is
        # why plain CI is green but the TestFlight archive failed at package resolution.
        run: bash scripts/build-etios-xcframework.sh

      - name: Build UniFFI XCFramework (device + simulator slices)
        run: bash scripts/build-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      # Archive UNSIGNED. Automatic signing at archive time insists on a *development*
      # profile (which embeds device UDIDs → fails with "team has no devices"), and a
      # manual distribution identity conflicts with the SPM/framework targets' automatic
      # signing. TestFlight only needs *distribution* signing, which we apply at export.
      - name: Archive (unsigned, signed at export)
        # -skipPackagePluginValidation: SwiftTerm v1.19+ ships a build-tool plugin
        # (SwiftTermBuildInfoPlugin) that headless xcodebuild will not run without
        # explicit trust. Reviewed (read-only git build-info stamper, no network) and
        # consciously trusted; version pinned exact in project.yml. Mirrors ci.yml.
        env:
          SUPPORTER_PREVIEW: ${{ inputs.supporter_preview && 'on' || 'off' }}
        run: |
          set -euo pipefail
          echo "SUPPORTER_PREVIEW=${SUPPORTER_PREVIEW}"
          extra=()
          if [ "${SUPPORTER_PREVIEW}" = "on" ]; then
            extra+=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SUPPORTER_PREVIEW')
          fi
          xcodebuild archive \
            -project Semicolyn.xcodeproj -scheme Semicolyn \
            -destination 'generic/platform=iOS' \
            -archivePath build/Semicolyn.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${extra[@]+"${extra[@]}"}   # bash 3.2-safe empty-array expansion under set -u

      # Crash reports come only from Apple (privacy audit P-M7: no third-party crash
      # SDK), so the archive must carry the app's dSYM for TestFlight and Xcode
      # Organizer to symbolicate them. The Mosh, ET and Rust static libraries link into
      # the app binary, so its dSYM covers them too.
      # Also confirm the privacy manifest (P-M7) made it into the app bundle.
      - name: Check dSYMs and privacy manifest
        run: |
          set -euo pipefail
          ls -d build/Semicolyn.xcarchive/dSYMs/*.app.dSYM
          ls build/Semicolyn.xcarchive/Products/Applications/*.app/PrivacyInfo.xcprivacy

      - name: Export signed .ipa
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Semicolyn.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      # Keep the signed build downloadable even if the upload step needs a tweak,
      # you can hand it to Transporter as a fallback.
      - name: Upload .ipa artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Semicolyn-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls build/export/*.ipa | head -1)"
          # altool exits 0 even when App Store Connect REJECTS the upload (e.g. a 409
          # export-compliance validation error), so its exit code alone is not trustworthy.
          # Capture output, tee it for the log, and fail the job if the tell-tale failure
          # markers appear, otherwise a rejected build silently reports the lane green.
          # Also require the success line. A bare "ERROR:" is not a marker: Xcode 27's
          # altool logs a harmless "ERROR: ... ResumeFilePath" on good uploads.
          set +e
          OUT="$(xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" -ne 0 ] || ! printf '%s' "$OUT" | grep -q 'UPLOAD SUCCEEDED' \
            || printf '%s' "$OUT" | grep -qiE 'UPLOAD FAILED|Failed to upload|VALIDATION_ERROR'; then
            echo "::error::altool upload to TestFlight failed, see log above."
            exit 1
          fi
