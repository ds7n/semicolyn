version = 1

# Files that cannot carry an SPDX header comment (lockfiles, JSON, images, test
# keys) and project docs and configs without one. Every other file
# carries its own header or a .license sidecar.

[[annotations]]
path = [
    ".gitmodules",
    "Cargo.toml",
    "Cargo.lock",
    "Package.swift",
    "Package.resolved",
    "README.md",
    "PRIVACY.md",
    "crates/semicolyn-ssh-core/Cargo.toml",
    "scripts/build-xcframework.sh",
    "docker/sshd-legacy.conf",
    "tools/syslog-sink/**",
    "docs/**",
    "App/Assets.xcassets/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 True Positive LLC"
SPDX-License-Identifier = "GPL-3.0-only"

# Throwaway keys generated for the SSH test fixtures; not secrets.
[[annotations]]
path = "crates/semicolyn-ssh-core/tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 True Positive LLC"
SPDX-License-Identifier = "GPL-3.0-only"

# Vendored SwiftTerm (Vendor/SwiftTerm/SEMICOLYN.md): upstream MIT, copyright lines from
# its LICENSE. SEMICOLYN.md carries its own header.
[[annotations]]
path = "Vendor/SwiftTerm/**"
precedence = "closest"
SPDX-FileCopyrightText = [
    "2019-2026 Miguel de Icaza",
    "2017-2019 The xterm.js authors",
    "2014-2016 SourceLair Private Company",
    "2012-2013 Christopher Jeffrey",
    "2016 Ryan L McIntyre",
]
SPDX-License-Identifier = "MIT"
