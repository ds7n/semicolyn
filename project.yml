#
# XcodeGen manifest for the Semicolyn iOS app target. SwiftPM can't produce an iOS
# .app bundle, so the app lives here; `xcodegen generate` (macOS) emits the
# .xcodeproj. The Rust SSH core is linked via the local SwiftPM package's
# SemicolynSSHCoreFFI product (backed by SemicolynSSHCore.xcframework, built first by
# scripts/build-xcframework.sh). The terminal renderer is SwiftTerm.
name: Semicolyn

options:
  bundleIdPrefix: com.truepositive
  deploymentTarget:
    iOS: "17.0"

packages:
  # The repo-root SwiftPM package (SemicolynKit + the macOS/iOS-only SemicolynSSHCoreFFI).
  SemicolynPackage:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned exact (was floating `from: "1.0.0"`, which silently drifted): v1.19.0
    # added a build-tool plugin (SwiftTermBuildInfoPlugin) that headless xcodebuild
    # refuses to run without explicit trust. We reviewed that plugin (a read-only
    # `git`-metadata stamper, no network) and consciously adopt v1.20.0 + grant the
    # trust via `-skipPackagePluginValidation` in ci.yml / release-testflight.yml.
    # Bump this deliberately; do not float. (2026-08-19)
    # NB: XcodeGen's exact-pin key is `exactVersion` (not SwiftPM's `exact`).
    exactVersion: "1.20.0"
  # The vendored swift-sodium package (extern/swift-sodium), prebuilt
  # Clibsodium.xcframework. ET's libETerminal.a calls crypto_secretbox_* /
  # sodium_init / sodium_memzero directly; link the product at app-link time
  # per docs/et-ios-build-notes.md (libsodium stays a separate slice, not
  # merged into ETerminal.xcframework).
  Sodium:
    path: extern/swift-sodium

targets:
  Semicolyn:
    type: application
    platform: iOS
    sources:
      - path: App
        # .ttf files under App/Resources/Fonts are auto-classified as bundle
        # resources by XcodeGen. Exclude the REUSE .license sidecars: they document
        # the fonts' licensing in-repo but must not ship inside the .app. Same for the
        # predictor seed's REUSE sidecar and provenance record under Resources/predictor:
        # seed_v1.sketch and SEED_ATTRIBUTION.md still bundle so the CC-BY/MIT credit
        # is user-visible at runtime.
        excludes:
          - "Resources/Fonts/*.license"
          - "Resources/predictor/*.license"
          - "Resources/predictor/*.provenance.txt"
          - "Resources/predictor/blocklist_extra.txt"
    dependencies:
      - package: SemicolynPackage
        product: SemicolynSSHCoreFFI
      - package: SemicolynPackage
        product: SemicolynKit
      - package: SwiftTerm
      - package: Sodium
        product: Clibsodium
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Mosh's Network::Compressor uses zlib (_compress/_uncompress). The Mosh
        # xcframework provides the Mosh objects but not zlib; link the iOS SDK's
        # libz here (Mosh's own build gets it via a system -lz).
        # ET's TcpSocketHandler::connect uses res_9_init from the resolver;
        # link the iOS SDK's libresolv here (libETerminal.a doesn't bundle it).
        OTHER_LDFLAGS: "-lz -lresolv"
        PRODUCT_BUNDLE_IDENTIFIER: com.truepositive.semicolyn
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # App icon lives in App/Assets.xcassets/AppIcon.appiconset (single 1024²
        # universal slot). Art is owed before the first TestFlight upload; until
        # then the slot is empty and the asset compiler emits a missing-icon
        # warning on the macOS CI job (non-fatal, simulator builds don't require it).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # MVP: Swift 5 language mode for the app target. The UniFFI callback
        # bridges + SwiftTerm aren't Swift-6 strict-concurrency clean; tighten later.
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Bundled Nerd Fonts (App/Resources/Fonts/*.ttf). UIAppFonts registers them at
        # launch so the terminal can render icon/powerline glyphs. XcodeGen bundles the
        # .ttf files automatically (non-source files under the `App` source tree).
        # Xcode maps this space-separated INFOPLIST_KEY_ value to the UIAppFonts array.
        INFOPLIST_KEY_UIAppFonts: "HackNerdFont-Regular.ttf JetBrainsMonoNerdFont-Regular.ttf"
        # Required for App Store upload since the app targets iPad (device family 1,2).
        # A terminal is comfortable in any orientation; iPhone omits upside-down per norm.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Export compliance, see docs/export-compliance.md for the full basis.
        # semicolyn uses ONLY standard, published crypto (AES, ChaCha20-Poly1305,
        # curve25519, ed25519): Mosh via Apple CommonCrypto, SSH via russh
        # (aws-lc-rs). This is the mass-market case (ECCN 5D992.c) for a terminal
        # client, standard algorithms, publicly available, used to secure the
        # user's own connections. NOT proprietary/non-standard crypto. We answer
        # NO here (no ITSEncryptionExportComplianceCode; a "YES" without a matching
        # code 409s the TestFlight upload). True Positive LLC self-classifies under
        # the mass-market exemption; France availability stays excluded pending the
        # ANSSI declaration (see the testflight-lane memory + docs).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # SSH/mosh to hosts on the LAN (192.168.x, *.local) triggers iOS's Local
        # Network permission prompt; without this string the connection silently
        # fails. Not an App ID capability, a privacy usage string.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "semicolyn connects to the SSH and Mosh servers you specify."
        # No signing in CI; the simulator build is the gate.
        CODE_SIGNING_ALLOWED: NO
        # The Mosh transport bridge (App/Mosh/MoshSession.mm) is Obj-C++ over
        # Mosh.xcframework; expose it to Swift + set the C++ dialect it needs.
        SWIFT_OBJC_BRIDGING_HEADER: App/Mosh/Semicolyn-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17

  # macOS-CI-only unit tests for the Obj-C++ MoshSession bridge. STANDALONE, it
  # compiles the real bridge (App/Mosh/MoshSession.mm) + a loopback fake mosh_main
  # (Tests/AppTests/fake_mosh_main.mm) and deliberately does NOT link Mosh.xcframework
  # or the app. The fake is therefore the ONLY `mosh_main` definition (no duplicate-
  # symbol collision with the real network one), and the bridge only needs the
  # `mosh_main` *declaration*, supplied by the vendored header on the search path
  # below. (The app-links-Mosh gate is the separate "Build Semicolyn app" CI step.)
  SemicolynBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppTests
      - path: App/Mosh/MoshSession.mm
      - path: App/ET/ETSession.mm
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CODE_SIGNING_ALLOWED: NO
        # Mosh: resolve moshiosbridge.h without linking the framework.
        # ET: resolve eternaltermlib.h (the <eternaltermlib.h> angle include) the same way.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/extern/mosh/src/frontend
          - $(SRCROOT)/extern/eternaltermlib/include
        # Host-less logic-test bundle: `bundle.unit-test` defaults to no TEST_HOST,
        # so we deliberately do NOT set TEST_HOST (an empty-string value can be
        # misread as "hosted but empty"). The explicit scheme below makes the test
        # action unambiguous + shared for `xcodebuild -scheme SemicolynBridgeTests test`.

# Explicit shared scheme so `xcodebuild -scheme SemicolynBridgeTests test` is
# guaranteed to find a Test action, rather than relying on xcodegen's autogenerated
# per-target scheme (whose sharing + test-wiring for a host-less bundle is the one
# thing we cannot verify without a full macOS CI cycle).
schemes:
  SemicolynBridgeTests:
    build:
      targets:
        SemicolynBridgeTests: [test]
    test:
      targets:
        - SemicolynBridgeTests
